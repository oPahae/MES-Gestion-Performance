<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Connexion requise</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:white;
}

.box{
    text-align:center;
    max-width:500px;
}

button{
    margin-top:20px;
    padding:12px 24px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>
<body>

<div class="box">
    <h1>📡 Aucune connexion Internet</h1>

    <p>
        Impossible de charger MES Performance.
    </p>

    <p>
        Vérifiez votre connexion Internet puis réessayez.
    </p>

    <button onclick="location.reload()">
        Réessayer
    </button>
</div>

</body>
</html>
